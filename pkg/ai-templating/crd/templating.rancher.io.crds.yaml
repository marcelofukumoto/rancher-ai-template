# CRDs backing the AI Templating extension. These replace the ConfigMap-based model:
#   CustomView       <- ConfigMaps labelled templates.rancher.io/custom-view
#   HomeTemplate     <- ConfigMaps labelled templates.rancher.io/home-saved
#   TemplatingConfig <- the templating-config (kill switch) + home-applied (pointer) ConfigMaps
#
# Steve exposes each as a type the engine reads:
#   templating.rancher.io.customview / .hometemplate / .templatingconfig
#
# Shipped in the extension Helm chart so installing the extension registers them.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: customviews.templating.rancher.io
spec:
  group: templating.rancher.io
  scope: Namespaced
  names:
    plural: customviews
    singular: customview
    kind: CustomView
    listKind: CustomViewList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ['kind']
              properties:
                kind:
                  type: string
                  enum: ['template', 'code']
                  default: 'template'
                  description: '"template" = JSON widgets; "code" = a runtime-compiled .vue SFC.'
                meta:
                  type: object
                  description: 'Nav identity: id (unique, kebab-case), name, icon.'
                  x-kubernetes-preserve-unknown-fields: true
                nav:
                  type: object
                  description: 'Nav placement: group, groupLabel, weight, hidden.'
                  x-kubernetes-preserve-unknown-fields: true
                template:
                  type: object
                  description: 'JSON widget document (when kind=template).'
                  x-kubernetes-preserve-unknown-fields: true
                source:
                  type: string
                  description: 'Vue SFC source (when kind=code).'
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hometemplates.templating.rancher.io
spec:
  group: templating.rancher.io
  scope: Namespaced
  names:
    plural: hometemplates
    singular: hometemplate
    kind: HomeTemplate
    listKind: HomeTemplateList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ['source']
              properties:
                displayName:
                  type: string
                  description: 'Human label shown in the Home template picker.'
                source:
                  type: string
                  description: 'Vue SFC source rendered as the Home page.'
                meta:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Name
          type: string
          jsonPath: .spec.displayName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: templatingconfigs.templating.rancher.io
spec:
  group: templating.rancher.io
  scope: Namespaced
  names:
    plural: templatingconfigs
    singular: templatingconfig
    kind: TemplatingConfig
    listKind: TemplatingConfigList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: true
                  description: 'Global kill switch. false = ignore all templating, behave like stock Rancher.'
                home:
                  type: object
                  description: 'Which HomeTemplate is applied — globally and per-user.'
                  properties:
                    global:
                      type: string
                      description: 'HomeTemplate name applied for everyone by default.'
                    users:
                      type: object
                      description: 'Per-user overrides: { <userId>: <HomeTemplate name> }.'
                      x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
