---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harvester-vms
  namespace: default
  labels:
    templates.rancher.io/ai-templating: 'true'
    templates.rancher.io/type: custom-view
data:
  kind: code
  view.vue: |
    <script>
    import ResourceTable from '@shell/components/ResourceTable';
    import { Banner } from '@components/Banner';
    const VM = 'kubevirt.io.virtualmachine';
    export default {
      components: { ResourceTable, Banner },
      created() {
        if (!this.schema) { return; }
        this.$store.dispatch('cluster/findAll', { type: VM })
          .then((rows) => { this.rows = rows || []; })
          .catch(() => { this.rows = []; });
      },
      data() { return { rows: [] }; },
      computed: { schema() { return this.$store.getters['cluster/schemaFor'](VM); } },
    };
    </script>
    <template>
      <div style="padding: 16px">
        <h1 class="mb-20">Virtual Machines</h1>
        <Banner
          v-if="!schema"
          color="warning"
          label="This view needs a Harvester cluster (the kubevirt VirtualMachine CRD isn't present here)."
        />
        <ResourceTable v-else :schema="schema" :rows="rows" :table-actions="false" :row-actions="false" />
      </div>
    </template>
  meta: '{"id":"harvester-vms","name":"Virtual Machines","icon":"compass"}'
  nav: '{"scope":"cluster","group":"root","weight":88}'
