apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-board
  namespace: default
  labels:
    templates.rancher.io/ai-templating: 'true'
    templates.rancher.io/type: custom-view
data:
  kind: code
  view.vue: |
    <script>
    import { Banner } from '@components/Banner';
    import { Card } from '@components/Card';
    export default {
      components: { Banner, Card },
      created() {
        this.$store.dispatch('cluster/findAll', { type: 'apps.deployment' })
          .then((r) => { this.deps = r || []; }).catch(() => { this.deps = []; });
      },
      data() { return { deps: [] }; },
      computed: {
        columns() {
          const by = {};
          this.deps.forEach((d) => { const ns = d.metadata.namespace; (by[ns] = by[ns] || []).push(d); });
          return Object.keys(by).map((ns) => ({ ns, items: by[ns] })).sort((a, b) => b.items.length - a.items.length).slice(0, 8);
        },
      },
      methods: {
        ok(d) { return ((d.status && d.status.availableReplicas) || 0) === ((d.spec && d.spec.replicas) || 0); },
        rep(d) { return ((d.status && d.status.availableReplicas) || 0) + '/' + ((d.spec && d.spec.replicas) || 0); },
      },
    };
    </script>
    <template>
      <div class="kb">
        <h1 class="mb-20">Workload Board</h1>
        <Banner color="info" label="Deployments grouped by namespace — a green edge means fully available, red means degraded." />
        <div class="kb__cols">
          <Card
            v-for="c in columns"
            :key="c.ns"
            class="kb__col"
            :show-highlight-border="false"
            :show-actions="false"
          >
            <template #title>
              <span class="kb__head">{{ c.ns }} <span class="text-muted">{{ c.items.length }}</span></span>
            </template>
            <template #body>
              <div v-for="d in c.items" :key="d.id" class="kb__card" :class="{ bad: !ok(d) }">
                <div class="kb__name">{{ d.metadata.name }}</div>
                <div class="kb__meta text-muted">{{ rep(d) }} ready</div>
              </div>
            </template>
          </Card>
        </div>
      </div>
    </template>
    <style scoped>
      .kb { padding: 16px; }
      .kb__cols { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
      .kb__col { min-width: 210px; flex: 0 0 210px; }
      .kb__head { font-weight: 700; }
      .kb__card { background: var(--body-bg); border: 1px solid var(--border); border-left: 3px solid #3fb950; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
      .kb__card.bad { border-left-color: #f85149; }
      .kb__name { font-weight: 600; font-size: 13px; word-break: break-all; }
      .kb__meta { font-size: 11px; }
    </style>
  meta: '{"id":"workload-board","name":"Workload Board","icon":"list-grouped"}'
  nav: '{"scope":"cluster","group":"my-apps","groupLabel":"My Apps","weight":97}'
