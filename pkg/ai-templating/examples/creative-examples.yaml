apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-treemap
  namespace: default
  labels:
    templates.rancher.io/ai-templating: 'true'
    templates.rancher.io/type: custom-view
data:
  kind: code
  view.vue: |
    <script>
    import { Banner } from '@components/Banner';
    import { Card } from '@components/Card';
    const UNIT = { Ki: 1 / 1024, Mi: 1, Gi: 1024, Ti: 1024 * 1024, Pi: 1024 * 1024 * 1024 };
    export default {
      components: { Banner, Card },
      created() {
        this.$store.dispatch('cluster/findAll', { type: 'persistentvolumeclaim' })
          .then((r) => { this.pvcs = r || []; }).catch(() => { this.pvcs = []; });
      },
      data() { return { pvcs: [] }; },
      computed: {
        tiles() {
          const mib = (s) => {
            const m = ('' + (s || '')).match(/([0-9.]+)\s*([A-Za-z]*)/);
            if (!m) { return 0; }
            return parseFloat(m[1]) * (UNIT[m[2]] || 1 / 1048576);
          };
          return this.pvcs.map((p) => {
            const cap = (p.spec && p.spec.resources && p.spec.resources.requests && p.spec.resources.requests.storage) ||
              (p.status && p.status.capacity && p.status.capacity.storage);
            return { id: p.id, name: p.metadata.name, ns: p.metadata.namespace, cap: cap || '?', mib: mib(cap) };
          }).sort((a, b) => b.mib - a.mib);
        },
        max() { return this.tiles.reduce((m, t) => Math.max(m, t.mib), 1); },
      },
      methods: {
        span(t) {
          const r = t.mib / this.max;
          if (r > 0.6) { return 'tm__tile--xl'; }
          if (r > 0.3) { return 'tm__tile--lg'; }
          if (r > 0.12) { return 'tm__tile--md'; }
          return '';
        },
      },
    };
    </script>
    <template>
      <div class="tm">
        <h1 class="mb-20">Storage Treemap</h1>
        <Banner color="info" label="Persistent volume claims sized by requested capacity — the big tiles eat the most disk." />
        <Banner v-if="!tiles.length" color="warning" label="No PersistentVolumeClaims in this cluster." />
        <Card v-else :show-highlight-border="false" :show-actions="false">
          <template #title><h3 class="mb-0">Claims by capacity</h3></template>
          <template #body>
            <div class="tm__grid">
              <div v-for="t in tiles" :key="t.id" class="tm__tile" :class="span(t)" :title="t.ns + '/' + t.name + ' — ' + t.cap">
                <div class="tm__cap">{{ t.cap }}</div>
                <div class="tm__name">{{ t.name }}</div>
              </div>
            </div>
          </template>
        </Card>
      </div>
    </template>
    <style scoped>
      .tm { padding: 16px; }
      .tm__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); grid-auto-rows: 84px; grid-auto-flow: dense; gap: 8px; }
      .tm__tile { background: var(--primary); color: #fff; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
      .tm__tile--md { grid-column: span 2; }
      .tm__tile--lg { grid-column: span 2; grid-row: span 2; }
      .tm__tile--xl { grid-column: span 3; grid-row: span 2; }
      .tm__cap { font-size: 20px; font-weight: 700; }
      .tm__name { font-size: 11px; opacity: 0.9; word-break: break-all; }
    </style>
  meta: '{"id":"storage-treemap","name":"Storage Treemap","icon":"storage"}'
  nav: '{"scope":"cluster","group":"dashboards","groupLabel":"Dashboards","weight":95}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-ticker
  namespace: default
  labels:
    templates.rancher.io/ai-templating: 'true'
    templates.rancher.io/type: custom-view
data:
  kind: code
  view.vue: |
    <script>
    import { Banner } from '@components/Banner';
    import { Card } from '@components/Card';
    import { BadgeState } from '@components/BadgeState';
    export default {
      components: { Banner, Card, BadgeState },
      created() {
        this.$store.dispatch('cluster/findAll', { type: 'event' })
          .then((r) => { this.events = r || []; }).catch(() => { this.events = []; });
      },
      data() { return { events: [] }; },
      computed: {
        feed() {
          const t = (e) => new Date(e.lastTimestamp || (e.metadata && e.metadata.creationTimestamp) || 0).getTime();
          return [...this.events].sort((a, b) => t(b) - t(a)).slice(0, 30);
        },
      },
      methods: {
        warn(e) { return e.type === 'Warning'; },
        obj(e) { const o = e.involvedObject || {}; return (o.kind || '') + '/' + (o.name || ''); },
      },
    };
    </script>
    <template>
      <div class="ev">
        <h1 class="mb-20">Event Ticker</h1>
        <Banner color="info" :label="'The cluster\'s latest ' + feed.length + ' events — warnings flagged in red.'" />
        <Card :show-highlight-border="false" :show-actions="false">
          <template #title><h3 class="mb-0">Recent events</h3></template>
          <template #body>
            <div v-for="e in feed" :key="e.id" class="ev__row" :class="{ warn: warn(e) }">
              <BadgeState :color="warn(e) ? 'bg-error' : 'bg-info'" :label="e.type || 'Normal'" />
              <span class="ev__reason">{{ e.reason }}</span>
              <span class="ev__obj text-muted">{{ obj(e) }}</span>
              <span class="ev__msg">{{ e.message }}</span>
            </div>
          </template>
        </Card>
      </div>
    </template>
    <style scoped>
      .ev { padding: 16px; }
      .ev__row { display: grid; grid-template-columns: 96px 130px 160px 1fr; gap: 10px; align-items: baseline; padding: 6px 8px; border-bottom: 1px solid var(--border); }
      .ev__row.warn { background: rgba(248, 81, 73, 0.06); }
      .ev__reason { font-weight: 600; }
      .ev__obj { font-size: 12px; font-family: monospace; word-break: break-all; }
      .ev__msg { font-size: 13px; color: var(--body-text); }
    </style>
  meta: '{"id":"event-ticker","name":"Event Ticker","icon":"notifier"}'
  nav: '{"scope":"cluster","group":"dashboards","groupLabel":"Dashboards","weight":95}'
