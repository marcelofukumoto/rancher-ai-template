apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-lights
  namespace: default
  labels:
    templates.rancher.io/ai-templating: 'true'
    templates.rancher.io/type: custom-view
data:
  kind: code
  view.vue: |
    <script>
    import { Banner } from '@components/Banner';
    import { Card } from '@components/Card';
    export default {
      components: { Banner, Card },
      created() {
        const L = (type, key) => this.$store.dispatch('cluster/findAll', { type })
          .then((r) => { this[key] = r || []; }).catch(() => { this[key] = []; });
        L('node', 'nodes'); L('apps.deployment', 'deps'); L('pod', 'pods'); L('batch.job', 'jobs');
      },
      data() { return { nodes: [], deps: [], pods: [], jobs: [] }; },
      computed: {
        lights() {
          const light = (bad, warnAt) => (bad === 0 ? 'green' : (bad <= warnAt ? 'amber' : 'red'));
          const nodesReady = this.nodes.filter((n) => ((n.status && n.status.conditions) || []).some((c) => c.type === 'Ready' && c.status === 'True')).length;
          const depsBad = this.deps.filter((d) => ((d.status && d.status.availableReplicas) || 0) < ((d.spec && d.spec.replicas) || 0)).length;
          const podsBad = this.pods.filter((p) => { const ph = p.status && p.status.phase; return ph !== 'Running' && ph !== 'Succeeded'; }).length;
          const jobsBad = this.jobs.filter((j) => (j.status && j.status.failed) > 0).length;
          return [
            { label: 'Nodes', detail: nodesReady + ' / ' + this.nodes.length + ' ready', color: (this.nodes.length && nodesReady === this.nodes.length) ? 'green' : 'red' },
            { label: 'Deployments', detail: depsBad + ' degraded', color: light(depsBad, 2) },
            { label: 'Pods', detail: podsBad + ' not running', color: light(podsBad, 3) },
            { label: 'Jobs', detail: jobsBad + ' failed', color: light(jobsBad, 0) },
          ];
        },
      },
    };
    </script>
    <template>
      <div class="tl">
        <h1 class="mb-20">Ops Traffic Lights</h1>
        <Banner color="info" label="Every subsystem, one glance — green is go, red needs you." />
        <Card :show-highlight-border="false" :show-actions="false">
          <template #title><h3 class="mb-0">Subsystem status</h3></template>
          <template #body>
            <div class="tl__grid">
              <div v-for="l in lights" :key="l.label" class="tl__cell">
                <div class="tl__light" :class="'tl__light--' + l.color" />
                <div class="tl__label">{{ l.label }}</div>
                <div class="tl__detail text-muted">{{ l.detail }}</div>
              </div>
            </div>
          </template>
        </Card>
      </div>
    </template>
    <style scoped>
      .tl { padding: 20px; }
      .tl__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; max-width: 760px; }
      .tl__cell { text-align: center; padding: 22px; border: 1px solid var(--border); border-radius: 12px; }
      .tl__light { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 12px; box-shadow: 0 0 22px currentColor; }
      .tl__light--green { background: #3fb950; color: #3fb950; }
      .tl__light--amber { background: #d29922; color: #d29922; }
      .tl__light--red { background: #f85149; color: #f85149; }
      .tl__label { font-weight: 700; }
      .tl__detail { font-size: 12px; }
    </style>
  meta: '{"id":"traffic-lights","name":"Traffic Lights","icon":"dashboard"}'
  nav: '{"scope":"cluster","group":"dashboards","groupLabel":"Dashboards","weight":95}'
